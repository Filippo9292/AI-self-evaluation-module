sampling:
  seed: 42
  references_per_visit: 5
  visits_per_image: 3
  real_min_images: 32
  real_max_images: 256
  real_sqrt_multiplier: 4
  checkpoint_max_images: 64
preprocessing:
  # Conservative size for six inline RGB PNGs. Changes invalidate the baseline.
  max_side: 384
  min_side: null
  resize: null
  interpolation: nearest
api:
  timeout_seconds: 60
  rate_limit_retries: 2
  retry_failed_requests: false
  # Cumulative HTTP attempts in this output directory; null disables the cap.
  max_calls: null
  max_request_bytes: 4000000
early_stopping:
  every_n_epochs: 1
  min_epochs: 30
  plateau_patience_epochs: 30
  post_target_epochs: 10
  target_confirmations: 3
  min_delta: 0.005
  # Distance = mean absolute difference of Q25/Q50/Q75 divided by 4.
  target_tolerance: 0.025
  target_reset_tolerance: 0.04
  resampling_trials: 500
reporting:
  boxes_per_page: 30
